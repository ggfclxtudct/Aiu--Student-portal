<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>AIU Student Portal</title>

<style>
body {
    margin: 0;
    font-family: Arial;
    background: #eef2f7;
}

/* LOGIN */
.login-box {
    width: 340px;
    margin: 120px auto;
    background: white;
    padding: 25px;
    border-radius: 12px;
    box-shadow: 0 0 15px rgba(0,0,0,0.2);
    text-align: center;
}

.login-box h2 {
    color: #0b3d91;
}

input {
    width: 92%;
    padding: 10px;
    margin: 8px 0;
    border: 1px solid #ccc;
    border-radius: 6px;
}

button {
    width: 95%;
    padding: 10px;
    background: #0b3d91;
    color: white;
    border: none;
    border-radius: 6px;
    cursor: pointer;
}

/* PORTAL */
.container {
    display: none;
    display: flex;
}

/* SIDEBAR */
.sidebar {
    width: 250px;
    height: 100vh;
    background: #0b3d91;
    color: white;
    padding: 20px;
    box-sizing: border-box;
}

.sidebar h2 {
    margin-top: 0;
}

.sidebar p {
    margin: 10px 0;
    font-size: 14px;
}

/* MAIN */
.main {
    flex: 1;
    padding: 30px;
}

table {
    width: 100%;
    background: white;
    border-collapse: collapse;
    box-shadow: 0 0 10px rgba(0,0,0,0.1);
    border-radius: 10px;
    overflow: hidden;
}

th, td {
    padding: 15px;
    border-bottom: 1px solid #ddd;
    text-align: center;
}

th {
    background: #e6f0ff;
}
</style>
</head>

<body>

<!-- LOGIN -->
<div class="login-box" id="loginBox">
    <h2>AIU Student Portal</h2>

    <input type="text" id="id" placeholder="Student ID">
    <input type="password" id="pass" placeholder="Password">

    <button onclick="login()">Login</button>

    <p id="error" style="color:red;"></p>
</div>

<!-- PORTAL -->
<div class="container" id="portal">

    <!-- SIDEBAR -->
    <div class="sidebar">
        <h2>AIU Portal</h2>
        <hr>
        <p><b>Name:</b></p>
        <p>Fouad Magdy Sary</p>
    </div>

    <!-- MAIN -->
    <div class="main">

        <h2>My Courses & Grades</h2>

        <table>
        <tr>
            <th>Course</th>
            <th>Grade</th>
        </tr>

        <tr>
            <td>Structured Programming</td>
            <td>B</td>
        </tr>

        <tr>
            <td>Information Systems & Technology</td>
            <td>B</td>
        </tr>

        <tr>
            <td>Entrepreneurship</td>
            <td>C</td>
        </tr>

        <tr>
            <td>Physics</td>
            <td>C</td>
        </tr>

        <tr>
            <td>Pre-Calculus</td>
            <td>D</td>
        </tr>

        </table>

    </div>
</div>

<script>
function login() {
    let id = document.getElementById("id").value;
    let pass = document.getElementById("pass").value;

    if(id === "25100245" && pass === "Maai12345") {
        document.getElementById("loginBox").style.display = "none";
        document.getElementById("portal").style.display = "flex";
    } else {
        document.getElementById("error").innerText = "Invalid ID or Password";
    }
}
</script>

</body>
</html>
